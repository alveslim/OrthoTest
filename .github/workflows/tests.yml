name: Testes Python

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verificar sintaxe
        run: python -m compileall -q app backend
      - name: Verificar imports da aplicação
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "app")
          import main
          import estado
          import tela_login
          import tela_participantes
          import tela_selecao
          import tela_teste
          import tela_dashboard
          import tela_resumo_ia
          import theme
          import backend.main
          PY
      - name: Executar testes
        run: python -m pytest -q
