[project]
name = "orthotest"
version = "1.0.0"
description = "OrthoTest - avaliação ortopédica acadêmica"
requires-python = ">=3.10"
# ATENÇÃO: o Vercel instala a API a partir DESTE bloco (o pyproject.toml tem prioridade sobre o
# requirements.txt). Por isso aqui ficam só as dependências do backend. As do app (Flet) estão em
# app/requirements.txt, que o `flet build` lê no lugar deste bloco.
dependencies = [
  "fastapi==0.104.1",
  "pydantic>=2.6,<3.0",
  "requests>=2.31,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.flet]
product = "OrthoTest"
company = "Universidade Nilton Lins"
org = "br.edu.niltonlins"
copyright = "Projeto acadêmico OrthoTest"

[tool.flet.app]
path = "app"
module = "main"
